<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; font-family: 'Anthropic Sans', sans-serif; background: transparent; }
  .diagram { width: 100%; overflow-x: auto; }
  svg text { font-family: 'Anthropic Sans', sans-serif; }
</style>
</head>
<body>
<div class="diagram">
<svg width="100%" viewBox="0 0 960 580" role="img">
  <title>Enterprise Data Platform Architecture</title>
  <desc>End-to-end data platform showing sources, ingestion, data lake layers, data warehouse layers, and consumption</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background zones -->
  <!-- AWS Cloud boundary -->
  <rect x="210" y="20" width="730" height="490" rx="12" fill="none" stroke="#E8A020" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="225" y="12" width="56" height="18" rx="4" fill="#F5F4F0"/>
  <text x="253" y="25" text-anchor="middle" font-size="11" font-weight="600" fill="#E8A020">AWS Cloud</text>

  <!-- Data Sources box -->
  <rect x="10" y="80" width="110" height="350" rx="10" fill="#EEE9FF" stroke="#A090DD" stroke-width="0.8"/>
  <text x="65" y="102" text-anchor="middle" font-size="11" font-weight="600" fill="#5040A0">Data Sources</text>

  <!-- Source items -->
  <rect x="22" y="112" width="86" height="30" rx="6" fill="#C8B8F8" stroke="#9070D0" stroke-width="0.5"/>
  <text x="65" y="132" text-anchor="middle" font-size="10" fill="#3A2880">COS / Files</text>

  <rect x="22" y="152" width="86" height="30" rx="6" fill="#C8B8F8" stroke="#9070D0" stroke-width="0.5"/>
  <text x="65" y="172" text-anchor="middle" font-size="10" fill="#3A2880">RDBMS</text>

  <rect x="22" y="192" width="86" height="30" rx="6" fill="#C8B8F8" stroke="#9070D0" stroke-width="0.5"/>
  <text x="65" y="212" text-anchor="middle" font-size="10" fill="#3A2880">APIs</text>

  <rect x="22" y="232" width="86" height="30" rx="6" fill="#C8B8F8" stroke="#9070D0" stroke-width="0.5"/>
  <text x="65" y="252" text-anchor="middle" font-size="10" fill="#3A2880">NoSQL</text>

  <rect x="22" y="272" width="86" height="30" rx="6" fill="#9070D8" stroke="#7050B8" stroke-width="0.5"/>
  <text x="65" y="292" text-anchor="middle" font-size="10" fill="#EEE8FF">Kafka / Events</text>

  <!-- Arrow from sources to ingestion -->
  <line x1="120" y1="255" x2="215" y2="255" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Ingestion + S3 Data Lake zone -->
  <rect x="220" y="50" width="330" height="400" rx="10" fill="#F5F5F5" stroke="#BBBBBB" stroke-width="0.8"/>
  <text x="385" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#555">Data Lake (S3)</text>

  <!-- EMR + PySpark labels -->
  <rect x="290" y="80" width="64" height="22" rx="4" fill="#FDE8C8" stroke="#E0901A" stroke-width="0.5"/>
  <text x="322" y="95" text-anchor="middle" font-size="9" fill="#8A5010">EMR / Spark</text>
  <rect x="374" y="80" width="56" height="22" rx="4" fill="#E0F0E0" stroke="#60A060" stroke-width="0.5"/>
  <text x="402" y="95" text-anchor="middle" font-size="9" fill="#305830">PySpark</text>

  <!-- Raw / Landing zone -->
  <rect x="236" y="108" width="100" height="110" rx="8" fill="#FDEBD0" stroke="#E0901A" stroke-width="0.8"/>
  <text x="286" y="128" text-anchor="middle" font-size="10" font-weight="600" fill="#7A4010">Landing Zone</text>
  <text x="286" y="148" text-anchor="middle" font-size="9" fill="#A06030">Raw / As-Is</text>
  <text x="286" y="166" text-anchor="middle" font-size="9" fill="#A06030">data</text>
  <text x="286" y="200" text-anchor="middle" font-size="8" fill="#C08050">Parquet · Hudi</text>

  <!-- Bronze Layer -->
  <rect x="350" y="108" width="90" height="110" rx="8" fill="#FDEBD0" stroke="#E0901A" stroke-width="0.8"/>
  <text x="395" y="130" text-anchor="middle" font-size="10" font-weight="600" fill="#7A4010">Bronze</text>
  <text x="395" y="148" text-anchor="middle" font-size="9" fill="#A06030">Layer</text>
  <text x="395" y="168" text-anchor="middle" font-size="9" fill="#A06030">(As-Is)</text>

  <!-- Silver Layer -->
  <rect x="352" y="232" width="90" height="110" rx="8" fill="#E8E8F8" stroke="#8080C0" stroke-width="0.8"/>
  <text x="397" y="254" text-anchor="middle" font-size="10" font-weight="600" fill="#303080">Silver</text>
  <text x="397" y="272" text-anchor="middle" font-size="9" fill="#505090">Layer</text>
  <text x="397" y="290" text-anchor="middle" font-size="9" fill="#505090">(Cleansed)</text>

  <!-- Gold Layer -->
  <rect x="456" y="108" width="84" height="234" rx="8" fill="#FFF8DC" stroke="#C8A800" stroke-width="0.8"/>
  <text x="498" y="135" text-anchor="middle" font-size="10" font-weight="600" fill="#705800">Gold</text>
  <text x="498" y="153" text-anchor="middle" font-size="9" fill="#907020">Layer</text>
  <text x="498" y="171" text-anchor="middle" font-size="9" fill="#907020">(Latest</text>
  <text x="498" y="187" text-anchor="middle" font-size="9" fill="#907020">Version)</text>

  <!-- Arrows within S3 -->
  <line x1="336" y1="163" x2="350" y2="163" stroke="#C08030" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="440" y1="163" x2="456" y2="163" stroke="#C08030" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="397" y1="218" x2="397" y2="232" stroke="#8080C0" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="442" y1="287" x2="456" y2="287" stroke="#C0A800" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Arrow from S3 to Snowflake -->
  <line x1="553" y1="225" x2="600" y2="225" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- dbt label -->
  <rect x="556" y="190" width="38" height="20" rx="4" fill="#FFE0E0" stroke="#D04040" stroke-width="0.5"/>
  <text x="575" y="204" text-anchor="middle" font-size="9" fill="#902020">dbt</text>

  <!-- Snowflake zone -->
  <rect x="605" y="50" width="290" height="310" rx="10" fill="#E8F4FF" stroke="#2080C0" stroke-width="0.8"/>
  <text x="750" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#105090">Snowflake</text>

  <!-- Persistent Staging -->
  <rect x="618" y="88" width="82" height="100" rx="8" fill="#B8DEFF" stroke="#2080C0" stroke-width="0.8"/>
  <text x="659" y="112" text-anchor="middle" font-size="9" font-weight="600" fill="#104070">Persistent</text>
  <text x="659" y="128" text-anchor="middle" font-size="9" fill="#206090">Staging</text>
  <text x="659" y="144" text-anchor="middle" font-size="9" fill="#206090">Layer</text>

  <!-- Curated Layer -->
  <rect x="712" y="88" width="82" height="100" rx="8" fill="#B8DEFF" stroke="#2080C0" stroke-width="0.8"/>
  <text x="753" y="112" text-anchor="middle" font-size="9" font-weight="600" fill="#104070">Curated</text>
  <text x="753" y="128" text-anchor="middle" font-size="9" fill="#206090">Layer</text>

  <!-- Aggregate Layer -->
  <rect x="806" y="88" width="82" height="100" rx="8" fill="#B8DEFF" stroke="#2080C0" stroke-width="0.8"/>
  <text x="847" y="112" text-anchor="middle" font-size="9" font-weight="600" fill="#104070">Aggregate</text>
  <text x="847" y="128" text-anchor="middle" font-size="9" fill="#206090">Layer</text>

  <!-- Arrows within Snowflake -->
  <line x1="700" y1="138" x2="712" y2="138" stroke="#2060A0" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="794" y1="138" x2="806" y2="138" stroke="#2060A0" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Data Science datasets (subset) -->
  <text x="750" y="218" text-anchor="middle" font-size="9" fill="#606060">Subset of data</text>
  <rect x="700" y="228" width="100" height="50" rx="8" fill="#FFD0D0" stroke="#C04040" stroke-width="0.8"/>
  <text x="750" y="250" text-anchor="middle" font-size="9" font-weight="600" fill="#802020">Data Science</text>
  <text x="750" y="266" text-anchor="middle" font-size="9" fill="#A04040">Datasets</text>
  <line x1="750" y1="208" x2="750" y2="228" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Arrow from Snowflake to Consumption -->
  <line x1="895" y1="138" x2="910" y2="138" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Consumption zone -->
  <rect x="912" y="58" width="40" height="280" rx="8" fill="#E8F8E8" stroke="#40A040" stroke-width="0.8"/>
  <text x="932" y="80" text-anchor="middle" font-size="9" font-weight="600" fill="#206020">BI &amp;</text>
  <text x="932" y="96" text-anchor="middle" font-size="9" fill="#308030">Analytics</text>

  <!-- Semantic Layer + Dashboards (outside AWS) -->
  <!-- shown as labels to the right -->

  <!-- Platform Services row -->
  <rect x="228" y="465" width="700" height="48" rx="8" fill="#FFF0F8" stroke="#D060A0" stroke-width="0.8"/>
  <text x="578" y="481" text-anchor="middle" font-size="10" font-weight="600" fill="#803060">Platform Services</text>

  <!-- Service pills -->
  <rect x="238" y="487" width="62" height="18" rx="4" fill="#F0C0D8" stroke="#C060A0" stroke-width="0.4"/>
  <text x="269" y="500" text-anchor="middle" font-size="8" fill="#601040">Orchestration</text>

  <rect x="308" y="487" width="62" height="18" rx="4" fill="#F0C0D8" stroke="#C060A0" stroke-width="0.4"/>
  <text x="339" y="500" text-anchor="middle" font-size="8" fill="#601040">Secrets Mgr</text>

  <rect x="378" y="487" width="48" height="18" rx="4" fill="#F0C0D8" stroke="#C060A0" stroke-width="0.4"/>
  <text x="402" y="500" text-anchor="middle" font-size="8" fill="#601040">KMS</text>

  <rect x="434" y="487" width="48" height="18" rx="4" fill="#F0C0D8" stroke="#C060A0" stroke-width="0.4"/>
  <text x="458" y="500" text-anchor="middle" font-size="8" fill="#601040">EKS</text>

  <rect x="490" y="487" width="48" height="18" rx="4" fill="#F0C0D8" stroke="#C060A0" stroke-width="0.4"/>
  <text x="514" y="500" text-anchor="middle" font-size="8" fill="#601040">ECR</text>

  <rect x="546" y="487" width="62" height="18" rx="4" fill="#F0C0D8" stroke="#C060A0" stroke-width="0.4"/>
  <text x="577" y="500" text-anchor="middle" font-size="8" fill="#601040">OpenSearch</text>

  <rect x="616" y="487" width="36" height="18" rx="4" fill="#F0C0D8" stroke="#C060A0" stroke-width="0.4"/>
  <text x="634" y="500" text-anchor="middle" font-size="8" fill="#601040">IAM</text>

  <rect x="660" y="487" width="62" height="18" rx="4" fill="#F0C0D8" stroke="#C060A0" stroke-width="0.4"/>
  <text x="691" y="500" text-anchor="middle" font-size="8" fill="#601040">GuardDuty</text>

  <rect x="730" y="487" width="62" height="18" rx="4" fill="#F0C0D8" stroke="#C060A0" stroke-width="0.4"/>
  <text x="761" y="500" text-anchor="middle" font-size="8" fill="#601040">Config / Hub</text>

  <rect x="800" y="487" width="56" height="18" rx="4" fill="#F0C0D8" stroke="#C060A0" stroke-width="0.4"/>
  <text x="828" y="500" text-anchor="middle" font-size="8" fill="#601040">Inspector</text>

  <!-- Legend -->
  <text x="16" y="460" font-size="9" fill="#888">* All services on AWS unless noted</text>

  <!-- Title -->
  <text x="480" y="548" text-anchor="middle" font-size="11" font-weight="600" fill="#444">Enterprise Data Platform — Reference Architecture</text>
</svg>
</div>
</body>
</html>
