<svg width="100%" viewBox="0 0 600 340" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Seven principles for production-grade data pipelines</title>
  <desc>A Snowflake to BigQuery pipeline — source, staging bucket, warehouse — drawn as the easy core, wrapped by the seven surrounding concerns that are the real work: one artifact, config as data, least privilege, design over permissions, loud validation, safe state, incremental deploy.</desc>
  <defs>
    <marker id="arrow7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D4ED8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="596" height="336" rx="14" fill="#EEF4FC" stroke="#A9C5EC" stroke-width="0.8"/>

  <!-- The "wrapper" — the actual engineering -->
  <rect x="24" y="26" width="552" height="180" rx="12" fill="none" stroke="#4F86D6" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="40" y="46" fill="#1D4ED8" font-size="12" font-weight="600">Everything wrapped around it — the actual engineering</text>

  <!-- The easy core: the pipeline -->
  <rect x="88" y="96" width="132" height="46" rx="8" fill="#1D4ED8"/>
  <text x="154" y="119" text-anchor="middle" dominant-baseline="central" fill="#EAF1FE" font-size="13" font-weight="500">Snowflake</text>

  <rect x="252" y="96" width="132" height="46" rx="8" fill="#4F86D6"/>
  <text x="318" y="113" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="12.5" font-weight="500">GCS stage</text>
  <text x="318" y="129" text-anchor="middle" dominant-baseline="central" fill="#DCE8FB" font-size="10">Parquet, headers on</text>

  <rect x="416" y="96" width="132" height="46" rx="8" fill="#1D4ED8"/>
  <text x="482" y="119" text-anchor="middle" dominant-baseline="central" fill="#EAF1FE" font-size="13" font-weight="500">BigQuery</text>

  <line x1="220" y1="119" x2="250" y2="119" stroke="#1D4ED8" stroke-width="1.4" marker-end="url(#arrow7)"/>
  <line x1="384" y1="119" x2="414" y2="119" stroke="#1D4ED8" stroke-width="1.4" marker-end="url(#arrow7)"/>
  <text x="318" y="166" text-anchor="middle" fill="#6B6B6B" font-size="11" font-style="italic">the data movement — the easy part</text>

  <!-- The seven principles -->
  <text x="40" y="238" fill="#1D4ED8" font-size="12" font-weight="600">Seven principles</text>

  <rect x="24" y="250" width="106" height="72" rx="8" fill="#EAF1FE" stroke="#A9C5EC" stroke-width="0.8"/>
  <text x="77" y="270" text-anchor="middle" fill="#1D4ED8" font-size="15" font-weight="700">1</text>
  <text x="77" y="290" text-anchor="middle" fill="#3A3A3A" font-size="9.5">One artifact,</text>
  <text x="77" y="303" text-anchor="middle" fill="#3A3A3A" font-size="9.5">many behaviours</text>

  <rect x="140" y="250" width="106" height="72" rx="8" fill="#EAF1FE" stroke="#A9C5EC" stroke-width="0.8"/>
  <text x="193" y="270" text-anchor="middle" fill="#1D4ED8" font-size="15" font-weight="700">2</text>
  <text x="193" y="290" text-anchor="middle" fill="#3A3A3A" font-size="9.5">Config</text>
  <text x="193" y="303" text-anchor="middle" fill="#3A3A3A" font-size="9.5">is data</text>

  <rect x="256" y="250" width="106" height="72" rx="8" fill="#EAF1FE" stroke="#A9C5EC" stroke-width="0.8"/>
  <text x="309" y="270" text-anchor="middle" fill="#1D4ED8" font-size="15" font-weight="700">3–4</text>
  <text x="309" y="290" text-anchor="middle" fill="#3A3A3A" font-size="9.5">Correct least</text>
  <text x="309" y="303" text-anchor="middle" fill="#3A3A3A" font-size="9.5">privilege</text>

  <rect x="372" y="250" width="106" height="72" rx="8" fill="#EAF1FE" stroke="#A9C5EC" stroke-width="0.8"/>
  <text x="425" y="270" text-anchor="middle" fill="#1D4ED8" font-size="15" font-weight="700">5–6</text>
  <text x="425" y="290" text-anchor="middle" fill="#3A3A3A" font-size="9.5">Loud failures,</text>
  <text x="425" y="303" text-anchor="middle" fill="#3A3A3A" font-size="9.5">safe state</text>

  <rect x="488" y="250" width="88" height="72" rx="8" fill="#EAF1FE" stroke="#A9C5EC" stroke-width="0.8"/>
  <text x="532" y="270" text-anchor="middle" fill="#1D4ED8" font-size="15" font-weight="700">7</text>
  <text x="532" y="290" text-anchor="middle" fill="#3A3A3A" font-size="9.5">Deploy only</text>
  <text x="532" y="303" text-anchor="middle" fill="#3A3A3A" font-size="9.5">what changed</text>
</svg>
