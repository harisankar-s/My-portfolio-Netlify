<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="A glossy gold award tile with CCAR-F and CCAR-P passed badges">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#151A3A"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.32" cy="0.72" r="0.55">
      <stop offset="0" stop-color="#2F6FEB" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2F6FEB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.72" cy="0.26" r="0.5">
      <stop offset="0" stop-color="#7A4CFF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7A4CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB547" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFB547" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <!-- the glossy tile, same recipe as .ico3d-amber on the hub -->
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#E0820E"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".6"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".22"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#B85F00" flood-opacity=".55"/>
    </filter>
    <filter id="glyph" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity=".3"/>
    </filter>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".07"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#glowA)"/>
  <rect width="1200" height="750" fill="url(#glowB)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <circle cx="600" cy="320" r="260" fill="url(#glowGold)"/>

  <!-- a few stars -->
  <g fill="#FFFFFF">
    <circle cx="190" cy="120" r="2" opacity=".7"/><circle cx="1010" cy="160" r="2.4" opacity=".8"/>
    <circle cx="300" cy="610" r="1.6" opacity=".5"/><circle cx="930" cy="590" r="1.8" opacity=".6"/>
    <circle cx="820" cy="90" r="1.4" opacity=".5"/><circle cx="110" cy="420" r="1.4" opacity=".5"/>
    <circle cx="1100" cy="430" r="1.6" opacity=".6"/>
  </g>

  <!-- glossy 3D award tile, slightly tilted like .ico3d -->
  <g transform="translate(600 315) skewY(-3) rotate(-4)">
    <g filter="url(#drop)">
      <rect x="-150" y="-150" width="300" height="300" rx="78" fill="url(#tile)"/>
    </g>
    <rect x="-150" y="-150" width="300" height="300" rx="78" fill="url(#inner)"/>
    <path d="M-144 -72 C-144 -116 -116 -144 -72 -144 H72 C116 -144 144 -116 144 -72 V-6 C70 18 -70 18 -144 -6 Z" fill="url(#shine)"/>
    <rect x="-149" y="-149" width="298" height="298" rx="77" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="3"/>
    <!-- award: medal on two ribbons -->
    <g filter="url(#glyph)" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-46 30 L-74 108 L-40 94 L-22 124 L-2 66"/>
      <path d="M46 30 L74 108 L40 94 L22 124 L2 66"/>
      <circle cx="0" cy="-22" r="70"/>
      <path d="M0 -60 L11 -36 L37 -33 L18 -15 L23 11 L0 -2 L-23 11 L-18 -15 L-37 -33 L-11 -36 Z" fill="#FFFFFF" stroke-width="6"/>
    </g>
  </g>

  <!-- passed badges -->
  <g font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="26" font-weight="600" letter-spacing="2">
    <g transform="translate(395 560)">
      <rect width="190" height="58" rx="29" fill="url(#chip)" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="2"/>
      <circle cx="34" cy="29" r="15" fill="#0E9F6E"/>
      <path d="M26 29 L32 35 L43 23" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="38" fill="#FFFFFF">CCAR-F</text>
    </g>
    <g transform="translate(615 560)">
      <rect width="190" height="58" rx="29" fill="url(#chip)" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="2"/>
      <circle cx="34" cy="29" r="15" fill="#0E9F6E"/>
      <path d="M26 29 L32 35 L43 23" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="38" fill="#FFFFFF">CCAR-P</text>
    </g>
  </g>
</svg>
