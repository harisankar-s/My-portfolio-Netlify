<svg width="100%" viewBox="0 0 600 410" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Agentic AI — reasoning loop</title>
  <desc>Setup flows into a reasoning loop. Specify Task, Choose LLM, Integrate Tools and APIs branch to External Operation and Search APIs, merge into Embed Logic, then a control loop of Self-Decisions, Implement Actions, Improve and Evolve that feeds back on itself.</desc>
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="596" height="406" rx="14" fill="#EAF7F1" stroke="#5DCAA5" stroke-width="0.8"/>

  <!-- Row 1 setup -->
  <rect x="24" y="28" width="166" height="46" rx="8" fill="#0F6E56"/>
  <text x="107" y="51" text-anchor="middle" dominant-baseline="central" fill="#E1F5EE" font-size="13" font-weight="500">Specify Task</text>
  <rect x="217" y="28" width="166" height="46" rx="8" fill="#0F6E56"/>
  <text x="300" y="51" text-anchor="middle" dominant-baseline="central" fill="#E1F5EE" font-size="13" font-weight="500">Choose LLM Model</text>
  <rect x="410" y="28" width="166" height="46" rx="8" fill="#0F6E56"/>
  <text x="493" y="51" text-anchor="middle" dominant-baseline="central" fill="#E1F5EE" font-size="13" font-weight="500">Tools &amp; APIs</text>

  <line x1="190" y1="51" x2="215" y2="51" stroke="#0F6E56" stroke-width="1.4" marker-end="url(#arrowG)"/>
  <line x1="383" y1="51" x2="408" y2="51" stroke="#0F6E56" stroke-width="1.4" marker-end="url(#arrowG)"/>

  <!-- branch -->
  <line x1="480" y1="74" x2="210" y2="116" stroke="#0F6E56" stroke-width="1.4" marker-end="url(#arrowG)"/>
  <line x1="500" y1="74" x2="400" y2="116" stroke="#0F6E56" stroke-width="1.4" marker-end="url(#arrowG)"/>

  <!-- Row 2 tool calls -->
  <rect x="120" y="120" width="160" height="46" rx="8" fill="#1D9E75"/>
  <text x="200" y="143" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="13" font-weight="500">External Operation</text>
  <rect x="320" y="120" width="160" height="46" rx="8" fill="#1D9E75"/>
  <text x="400" y="143" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="13" font-weight="500">Search / APIs</text>

  <line x1="210" y1="166" x2="288" y2="203" stroke="#0F6E56" stroke-width="1.4" marker-end="url(#arrowG)"/>
  <line x1="390" y1="166" x2="312" y2="203" stroke="#0F6E56" stroke-width="1.4" marker-end="url(#arrowG)"/>

  <!-- Row 3 merge -->
  <rect x="217" y="205" width="166" height="46" rx="8" fill="#0F6E56"/>
  <text x="300" y="228" text-anchor="middle" dominant-baseline="central" fill="#E1F5EE" font-size="13" font-weight="500">Embed Logic</text>

  <line x1="280" y1="251" x2="130" y2="300" stroke="#0F6E56" stroke-width="1.4" marker-end="url(#arrowG)"/>

  <!-- Loop region -->
  <rect x="12" y="288" width="576" height="92" rx="12" fill="#DCF1E9" stroke="#5DCAA5" stroke-width="0.8" stroke-dasharray="5 4"/>
  <text x="24" y="282" fill="#0F6E56" font-size="11" font-weight="700" letter-spacing="0.5">REASONING LOOP</text>

  <rect x="24" y="302" width="166" height="46" rx="8" fill="#085041"/>
  <text x="107" y="325" text-anchor="middle" dominant-baseline="central" fill="#E1F5EE" font-size="13" font-weight="500">Self-Decisions</text>
  <rect x="217" y="302" width="166" height="46" rx="8" fill="#085041"/>
  <text x="300" y="325" text-anchor="middle" dominant-baseline="central" fill="#E1F5EE" font-size="13" font-weight="500">Implement Actions</text>
  <rect x="410" y="302" width="166" height="46" rx="8" fill="#085041"/>
  <text x="493" y="325" text-anchor="middle" dominant-baseline="central" fill="#E1F5EE" font-size="13" font-weight="500">Improve &amp; Evolve</text>

  <line x1="190" y1="325" x2="215" y2="325" stroke="#0F6E56" stroke-width="1.4" marker-end="url(#arrowG)"/>
  <line x1="383" y1="325" x2="408" y2="325" stroke="#0F6E56" stroke-width="1.4" marker-end="url(#arrowG)"/>

  <!-- return loop -->
  <path d="M493 348 L493 366 Q493 371 488 371 L112 371 Q107 371 107 366 L107 351" fill="none" stroke="#1D9E75" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowGd)"/>

  <text x="300" y="400" text-anchor="middle" fill="#0F6E56" font-size="11.5" font-weight="500">Acts, evaluates its own output, and adapts at runtime — no retraining</text>
</svg>
