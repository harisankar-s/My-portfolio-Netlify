<svg width="100%" viewBox="0 0 600 320" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>Traditional AI — linear pipeline</title>
  <desc>A snaking left-to-right pipeline: Specify Task, Collect Data, Refine Data, Vector DB, Retrieval Index, Model Training, Evaluate, Deploy, Generate Results. No feedback loop.</desc>
  <defs>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="596" height="316" rx="14" fill="#F4F3FC" stroke="#AFA9EC" stroke-width="0.8"/>

  <!-- Row 1 (L→R) -->
  <rect x="24" y="28" width="166" height="46" rx="8" fill="#534AB7"/>
  <text x="107" y="51" text-anchor="middle" dominant-baseline="central" fill="#EEEDFE" font-size="13" font-weight="500">Specify Task</text>
  <rect x="217" y="28" width="166" height="46" rx="8" fill="#534AB7"/>
  <text x="300" y="51" text-anchor="middle" dominant-baseline="central" fill="#EEEDFE" font-size="13" font-weight="500">Collect Data</text>
  <rect x="410" y="28" width="166" height="46" rx="8" fill="#534AB7"/>
  <text x="493" y="51" text-anchor="middle" dominant-baseline="central" fill="#EEEDFE" font-size="13" font-weight="500">Refine Data</text>

  <line x1="190" y1="51" x2="215" y2="51" stroke="#534AB7" stroke-width="1.4" marker-end="url(#arrowP)"/>
  <line x1="383" y1="51" x2="408" y2="51" stroke="#534AB7" stroke-width="1.4" marker-end="url(#arrowP)"/>
  <line x1="493" y1="74" x2="493" y2="135" stroke="#534AB7" stroke-width="1.4" marker-end="url(#arrowP)"/>

  <!-- Row 2 (R→L) -->
  <rect x="410" y="137" width="166" height="46" rx="8" fill="#7F77DD"/>
  <text x="493" y="160" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="13" font-weight="500">Vector DB</text>
  <rect x="217" y="137" width="166" height="46" rx="8" fill="#7F77DD"/>
  <text x="300" y="160" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="13" font-weight="500">Retrieval Index</text>
  <rect x="24" y="137" width="166" height="46" rx="8" fill="#534AB7"/>
  <text x="107" y="160" text-anchor="middle" dominant-baseline="central" fill="#EEEDFE" font-size="13" font-weight="500">Model Training</text>

  <line x1="410" y1="160" x2="385" y2="160" stroke="#534AB7" stroke-width="1.4" marker-end="url(#arrowP)"/>
  <line x1="217" y1="160" x2="192" y2="160" stroke="#534AB7" stroke-width="1.4" marker-end="url(#arrowP)"/>
  <line x1="107" y1="183" x2="107" y2="244" stroke="#534AB7" stroke-width="1.4" marker-end="url(#arrowP)"/>

  <!-- Row 3 (L→R) -->
  <rect x="24" y="246" width="166" height="46" rx="8" fill="#534AB7"/>
  <text x="107" y="269" text-anchor="middle" dominant-baseline="central" fill="#EEEDFE" font-size="13" font-weight="500">Evaluate</text>
  <rect x="217" y="246" width="166" height="46" rx="8" fill="#534AB7"/>
  <text x="300" y="269" text-anchor="middle" dominant-baseline="central" fill="#EEEDFE" font-size="13" font-weight="500">Deploy</text>
  <rect x="410" y="246" width="166" height="46" rx="8" fill="#26215C"/>
  <text x="493" y="269" text-anchor="middle" dominant-baseline="central" fill="#EEEDFE" font-size="13" font-weight="500">Generate Results</text>

  <line x1="190" y1="269" x2="215" y2="269" stroke="#534AB7" stroke-width="1.4" marker-end="url(#arrowP)"/>
  <line x1="383" y1="269" x2="408" y2="269" stroke="#534AB7" stroke-width="1.4" marker-end="url(#arrowP)"/>

  <text x="300" y="308" text-anchor="middle" fill="#534AB7" font-size="11.5" font-weight="500">Linear pipeline · no feedback loop · retrain from scratch when data drifts</text>
</svg>
