<svg width="100%" viewBox="0 0 680 780" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Traditional AI vs Agentic AI vs Agentic RAG</title>
  <desc>A left-to-right timeline diagram comparing three AI paradigms: Traditional AI (static pipeline), Agentic AI (autonomous reasoning loop), and Agentic RAG (retrieval plus reasoning loop).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ─── SECTION LABELS (left rail) ─── -->
  <rect x="6" y="28" width="6" height="220" rx="3" fill="#534AB7"/>
  <text font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#534AB7" x="32" y="138" transform="rotate(-90,32,138)" text-anchor="middle" letter-spacing="1.5">TRADITIONAL AI</text>

  <rect x="6" y="276" width="6" height="240" rx="3" fill="#0F6E56"/>
  <text font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F6E56" x="32" y="396" transform="rotate(-90,32,396)" text-anchor="middle" letter-spacing="1.5">AGENTIC AI</text>

  <rect x="6" y="544" width="6" height="220" rx="3" fill="#185FA5"/>
  <text font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#185FA5" x="32" y="654" transform="rotate(-90,32,654)" text-anchor="middle" letter-spacing="1.5">AGENTIC RAG</text>

  <!-- ═══ SECTION 1 — TRADITIONAL AI ═══ -->
  <rect x="46" y="28" width="622" height="220" rx="12" fill="#F4F3FC" stroke="#AFA9EC" stroke-width="0.8"/>

  <rect x="58" y="68" width="110" height="40" rx="8" fill="#534AB7" stroke="#3C3489" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#EEEDFE" x="113" y="92" text-anchor="middle" dominant-baseline="central">Specify task</text>
  <line x1="168" y1="88" x2="186" y2="88" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>

  <rect x="188" y="68" width="110" height="40" rx="8" fill="#534AB7" stroke="#3C3489" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#EEEDFE" x="243" y="92" text-anchor="middle" dominant-baseline="central">Collect data</text>
  <line x1="298" y1="88" x2="316" y2="88" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>

  <rect x="318" y="68" width="110" height="40" rx="8" fill="#534AB7" stroke="#3C3489" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#EEEDFE" x="373" y="92" text-anchor="middle" dominant-baseline="central">Refine data</text>
  <line x1="428" y1="88" x2="446" y2="88" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>

  <rect x="448" y="68" width="110" height="40" rx="8" fill="#534AB7" stroke="#3C3489" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#EEEDFE" x="503" y="92" text-anchor="middle" dominant-baseline="central">Model training</text>
  <line x1="558" y1="88" x2="576" y2="88" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>

  <rect x="578" y="68" width="82" height="40" rx="8" fill="#26215C" stroke="#26215C" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#EEEDFE" x="619" y="92" text-anchor="middle" dominant-baseline="central">Deploy</text>

  <rect x="318" y="36" width="110" height="28" rx="14" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#26215C" x="373" y="50" text-anchor="middle" dominant-baseline="central">Vector DB</text>
  <line x1="373" y1="68" x2="373" y2="64" stroke="#534AB7" stroke-width="0.8" fill="none"/>

  <rect x="318" y="130" width="110" height="40" rx="8" fill="#7F77DD" stroke="#534AB7" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#EEEDFE" x="373" y="154" text-anchor="middle" dominant-baseline="central">Retrieval index</text>
  <line x1="373" y1="108" x2="373" y2="130" stroke="#534AB7" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>
  <line x1="428" y1="150" x2="446" y2="150" stroke="#7F77DD" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>

  <rect x="448" y="130" width="110" height="40" rx="8" fill="#7F77DD" stroke="#534AB7" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#EEEDFE" x="503" y="154" text-anchor="middle" dominant-baseline="central">Evaluate</text>
  <line x1="558" y1="150" x2="576" y2="150" stroke="#7F77DD" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>

  <rect x="578" y="130" width="82" height="40" rx="8" fill="#26215C" stroke="#26215C" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#EEEDFE" x="619" y="154" text-anchor="middle" dominant-baseline="central">Results</text>
  <path d="M619 108 L619 130" stroke="#534AB7" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>

  <text font-family="-apple-system, sans-serif" font-size="11" fill="#534AB7" x="62" y="210">Static pipeline. Train once, deploy once.</text>
  <text font-family="-apple-system, sans-serif" font-size="11" fill="#534AB7" x="62" y="226">When data changes — retrain from scratch.</text>

  <!-- ═══ SECTION 2 — AGENTIC AI ═══ -->
  <rect x="46" y="276" width="622" height="240" rx="12" fill="#EAF7F1" stroke="#5DCAA5" stroke-width="0.8"/>

  <rect x="58" y="310" width="110" height="40" rx="8" fill="#0F6E56" stroke="#085041" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#E1F5EE" x="113" y="334" text-anchor="middle" dominant-baseline="central">Specify task</text>
  <line x1="168" y1="330" x2="186" y2="330" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>

  <rect x="188" y="310" width="110" height="40" rx="8" fill="#0F6E56" stroke="#085041" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#E1F5EE" x="243" y="334" text-anchor="middle" dominant-baseline="central">Choose LLM</text>
