  <rect x="318" y="310" width="110" height="40" rx="8" fill="#0F6E56" stroke="#085041" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#E1F5EE" x="373" y="334" text-anchor="middle" dominant-baseline="central">Tools &amp; APIs</text>
  <line x1="428" y1="330" x2="446" y2="330" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>

  <rect x="448" y="310" width="110" height="40" rx="8" fill="#0F6E56" stroke="#085041" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#E1F5EE" x="503" y="334" text-anchor="middle" dominant-baseline="central">External ops</text>
  <line x1="558" y1="330" x2="576" y2="330" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>

  <rect x="578" y="310" width="82" height="40" rx="8" fill="#085041" stroke="#04342C" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#E1F5EE" x="619" y="334" text-anchor="middle" dominant-baseline="central">Reason</text>

  <rect x="318" y="376" width="110" height="40" rx="8" fill="#1D9E75" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#E1F5EE" x="373" y="400" text-anchor="middle" dominant-baseline="central">Search / APIs</text>
  <line x1="373" y1="350" x2="373" y2="376" stroke="#0F6E56" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>

  <rect x="448" y="376" width="110" height="40" rx="8" fill="#1D9E75" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#E1F5EE" x="503" y="392" text-anchor="middle" dominant-baseline="central">Embed logic</text>
  <text font-family="-apple-system, sans-serif" font-size="11" fill="#9FE1CB" x="503" y="408" text-anchor="middle" dominant-baseline="central">&amp; iterate</text>
  <line x1="428" y1="396" x2="446" y2="396" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>

  <rect x="578" y="376" width="82" height="40" rx="8" fill="#085041" stroke="#04342C" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#E1F5EE" x="619" y="396" text-anchor="middle" dominant-baseline="central">Act &amp; evolve</text>
  <line x1="558" y1="396" x2="576" y2="396" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>
  <path d="M619 350 L619 396" stroke="#0F6E56" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M660 396 Q670 396 670 430 Q670 460 619 460 Q503 460 503 416" stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)"/>
  <text font-family="-apple-system, sans-serif" font-size="10" fill="#0F6E56" x="585" y="476" text-anchor="middle">self-improve</text>

  <text font-family="-apple-system, sans-serif" font-size="11" fill="#0F6E56" x="62" y="460">Autonomous reasoning. Acts, evaluates, improves — no retraining needed.</text>

  <!-- ═══ SECTION 3 — AGENTIC RAG ═══ -->
  <rect x="46" y="544" width="622" height="220" rx="12" fill="#EBF3FC" stroke="#85B7EB" stroke-width="0.8"/>

  <rect x="58" y="578" width="110" height="40" rx="8" fill="#185FA5" stroke="#0C447C" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#E6F1FB" x="113" y="602" text-anchor="middle" dominant-baseline="central">Specify task</text>
  <line x1="168" y1="598" x2="186" y2="598" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>

  <rect x="188" y="578" width="110" height="40" rx="8" fill="#185FA5" stroke="#0C447C" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#E6F1FB" x="243" y="602" text-anchor="middle" dominant-baseline="central">Fetch data</text>
  <line x1="298" y1="598" x2="316" y2="598" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>

  <rect x="318" y="578" width="110" height="40" rx="8" fill="#185FA5" stroke="#0C447C" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#E6F1FB" x="373" y="602" text-anchor="middle" dominant-baseline="central">Multi-step plan</text>
  <line x1="428" y1="598" x2="446" y2="598" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>

  <rect x="448" y="578" width="110" height="40" rx="8" fill="#185FA5" stroke="#0C447C" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#E6F1FB" x="503" y="602" text-anchor="middle" dominant-baseline="central">Iterative logic</text>
  <line x1="558" y1="598" x2="576" y2="598" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>

  <rect x="578" y="578" width="82" height="40" rx="8" fill="#0C447C" stroke="#042C53" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#E6F1FB" x="619" y="602" text-anchor="middle" dominant-baseline="central">Actions</text>

  <rect x="188" y="636" width="110" height="28" rx="14" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#0C447C" x="243" y="650" text-anchor="middle" dominant-baseline="central">Search / APIs</text>
  <line x1="243" y1="618" x2="243" y2="636" stroke="#185FA5" stroke-width="0.8" fill="none"/>

  <rect x="448" y="636" width="110" height="40" rx="8" fill="#378ADD" stroke="#185FA5" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#E6F1FB" x="503" y="660" text-anchor="middle" dominant-baseline="central">Verify results</text>
  <line x1="503" y1="618" x2="503" y2="636" stroke="#185FA5" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>

  <rect x="578" y="636" width="82" height="40" rx="8" fill="#0C447C" stroke="#042C53" stroke-width="0.5"/>
  <text font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#E6F1FB" x="619" y="660" text-anchor="middle" dominant-baseline="central">Refresh mem</text>
  <line x1="558" y1="656" x2="576" y2="656" stroke="#378ADD" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>
  <line x1="619" y1="618" x2="619" y2="636" stroke="#185FA5" stroke-width="0.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M660 656 Q672 656 672 700 Q672 724 619 724 Q503 724 503 676" stroke="#378ADD" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)"/>
  <text font-family="-apple-system, sans-serif" font-size="10" fill="#185FA5" x="585" y="702" text-anchor="middle">adapt</text>

  <text font-family="-apple-system, sans-serif" font-size="11" fill="#185FA5" x="62" y="728">Retrieval + reasoning. Verifies outputs, refreshes memory, adapts for future queries.</text>

  <!-- ─── BOTTOM COMPARISON PILLS ─── -->
  <rect x="58" y="752" width="184" height="22" rx="11" fill="#534AB7"/>
  <text font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#fff" x="150" y="763" text-anchor="middle" dominant-baseline="central">Gives answers</text>

  <rect x="250" y="752" width="184" height="22" rx="11" fill="#0F6E56"/>
